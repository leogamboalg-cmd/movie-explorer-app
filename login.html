<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MovieApp | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="images/favicon.png" type="image/png">
</head>

<body>

    <main class="page">

        <div class="login-box">

            <div class="brand">
                🎬 <span>MovieApp</span>
            </div>

            <h1>Login</h1>

            <form method="POST" class="login-form">
                <div class="field">
                    <span class="icon">👤</span>
                    <input id="email" type="text" placeholder="Enter your email">
                </div>

                <div class="field">
                    <span class="icon">🔒</span>
                    <input id="password" type="password" placeholder="Enter your password">
                </div>

                <button id="submitButton" type="submit">Log In</button>
            </form>

            <p class="signup">
                Don’t have an account?
                <a href="signup.html">Sign up</a>
            </p>
            <p class="render-note">
                First login may take up to 50 seconds because the backend runs on Render's free tier and may need to
                wake up.
            </p>
            <div id="toast"></div>
        </div>
        <script src="js/api.js"></script>
        <script src="js/toast.js"></script>
        <script src="js/authLogin.js"></script>
    </main>

</body>

</html>
